# 换装相机 Serverless 部署配置
# 腾讯云 SCF + 函数 URL（替代已停售的 API 网关）

app: homeglow
stage: ${opt:stage, 'prod'}
component: scf

inputs:
  # 函数名称
  name: homeglow-api

  # 运行环境
  runtime: Python3.9

  # 地域（根据你的需求修改）
  region: ap-guangzhou

  # 函数配置
  handler: scf_handler.handler
  src:
    src: ./backend
    exclude:
      - .git/**
      - .gitignore
      - __pycache__/**
      - "*.pyc"
      - venv/**
      - .env
      - uploads/**
      - "*.db"

  # 内存和超时配置
  memorySize: 512
  timeout: 60

  # 环境变量
  environment:
    variables:
      # COS 配置（必填）
      COS_SECRET_ID: ${env:COS_SECRET_ID}
      COS_SECRET_KEY: ${env:COS_SECRET_KEY}
      COS_REGION: ${env:COS_REGION, 'ap-guangzhou'}
      COS_BUCKET: ${env:COS_BUCKET}
      COS_CDN_DOMAIN: ${env:COS_CDN_DOMAIN, ''}

      # AI 服务配置
      IMAGE_GEN_API_KEY: ${env:IMAGE_GEN_API_KEY}
      IMAGE_GEN_API_URL: ${env:IMAGE_GEN_API_URL, 'https://xiaoai.plus/v1'}
      VLLM_API_KEY: ${env:VLLM_API_KEY}
      VLLM_API_URL: ${env:VLLM_API_URL, 'https://xiaoai.plus/v1'}

      # 电商 API（按需配置）
      PDD_CLIENT_ID: ${env:PDD_CLIENT_ID, ''}
      PDD_CLIENT_SECRET: ${env:PDD_CLIENT_SECRET, ''}
      PDD_PID: ${env:PDD_PID, ''}

      # 应用配置
      DEBUG: "false"

  # 函数 URL 配置（替代 API 网关，免费）
  functionUrl:
    enable: true
    # 认证类型：NONE-无需认证 | CAM-CAM鉴权
    authType: NONE

  # 公网访问配置
  publicAccess: true

  # 日志配置（可选）
  cls:
    logsetId: ${env:CLS_LOGSET_ID, ''}
    topicId: ${env:CLS_TOPIC_ID, ''}
